<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#172431;color:white;font:24px sans-serif}button{position:fixed;left:40px;top:40px;width:250px;height:64px;font:24px sans-serif;z-index:2}video{display:block;margin-top:130px;width:640px;max-width:95vw}#state{padding:16px}</style><button id="play">Play test video</button><video id="v" controls muted playsinline></video><div id="state">Mero TV playback check · Back returns to library</div><script>
const query=new URL(location).searchParams,run=query.get('run'),v=document.getElementById('v'),b=document.getElementById('play');
v.preload=query.get('preload')||'none';v.src='motion30.mp4?run='+encodeURIComponent(run);
const start=performance.now(),events=[];let clickWall=null,clicks=0,firstFrame=null,playResult='not requested';
function report(event){if(event){events.push({event,t:Math.round(performance.now()-start),time:v.currentTime});if(events.length>20)events.shift()}let q=v.getVideoPlaybackQuality(),r=b.getBoundingClientRect();let data={run,origin:performance.timeOrigin,wall:(performance.now()-start)/1000,time:v.currentTime,paused:v.paused,ready:v.readyState,network:v.networkState,error:v.error?{code:v.error.code,message:v.error.message}:null,width:v.videoWidth,height:v.videoHeight,total:q.totalVideoFrames,dropped:q.droppedVideoFrames,buffered:Array.from({length:v.buffered.length},(_,i)=>[v.buffered.start(i),v.buffered.end(i)]),clicks,clickWall,firstFrame,playResult,visibility:document.visibilityState,events,dpr:devicePixelRatio,innerHeight,button:{x:r.x+r.width/2,y:r.y+r.height/2}};document.getElementById('state').textContent='Mero TV test · '+(clicks?'Video '+v.currentTime.toFixed(1)+'s · '+v.videoWidth+'×'+v.videoHeight+' · '+q.droppedVideoFrames+' dropped':'Press Play test video')+' · Back returns to library';fetch('/metrics',{method:'POST',body:JSON.stringify(data)}).catch(()=>{})}
b.onclick=e=>{clicks++;clickWall=(performance.now()-start)/1000;report('click trusted='+e.isTrusted);playResult='pending';v.play().then(()=>{playResult='resolved';report('play resolved')}).catch(e=>{playResult=e.name+': '+e.message;report('play rejected')});if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(()=>{firstFrame=(performance.now()-start)/1000;report('first frame')})};
for(let e of ['loadstart','loadedmetadata','loadeddata','canplay','play','playing','pause','waiting','stalled','suspend','error','ended'])v.addEventListener(e,()=>report(e));setInterval(()=>report(),2000);report('document ready');
</script></html>
